<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅伴｜行程規劃</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon.svg"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="theme-color" content="#F4F8FC">
<style>
:root{--g:#2F5D8A;--lg:#DCE8F4;--acc:#2F5D8A;--hd:#F4F8FC;--hdtx:#16283A;--line:#D5E0EB;--tint:#DCE8F4;--tintfg:#1F4468;--bg:#FBF5EC;--card:#FFFDF9;--tx:#111;--mut:#7A6E62;--bd:#E7D8C6;--fly:#388153;--fan:#C2410C}
html.dark{color-scheme:dark;--g:#3B6A99;--lg:#1E3247;--acc:#8DB6E0;--hd:#18212C;--hdtx:#EAF0F6;--line:#2A3846;--tint:#22344A;--tintfg:#8DB6E0;--bg:#11161D;--card:#1C2530;--tx:#EEF2F6;--mut:#A3AFBC;--bd:#334355;--fly:#2F6E47;--fan:#A93A0B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{background:var(--hd);color:var(--hdtx);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:5}
header img#logo{width:40px;height:40px;border-radius:11px;box-shadow:0 2px 6px rgba(20,45,75,.25)}
header h1{flex:1 1 auto;min-width:0;font-size:19px;margin:0;font-weight:800;overflow:hidden}
header small{display:block;font-size:11px;font-weight:400;color:#4E6A86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
html.dark header small{color:#9DB6CF}
#annbell{position:relative;width:40px;height:40px;margin:-6px 0 -6px -4px;border:0;background:var(--tint);border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
#nfybell{position:relative;width:44px;height:44px;margin:-6px -4px -6px 0;border:0;background:var(--tint);border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
#thbtn{width:44px;height:44px;border:0;background:none;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
header button svg{width:22px;height:22px;fill:none;stroke:var(--tintfg);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
header button b{position:absolute;top:4px;right:4px;background:#E53935;color:#fff;font-size:11px;border-radius:9px;padding:0 5px;line-height:16px}header button b:empty{display:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#FFFDF9f2;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid #e3e8ee;padding:4px env(safe-area-inset-right) calc(4px + env(safe-area-inset-bottom)) env(safe-area-inset-left);z-index:5}
nav button{flex:1 1 0;min-width:0;min-height:52px;border:0;background:none;padding:4px 0 2px;font-size:10.5px;color:#8a949e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:inherit}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
nav button.on{color:var(--g);font-weight:700}nav button.on svg{transform:translateY(-1px) scale(1.08)}
html.dark nav{background:#161E27f2;border-top-color:#2A3846}html.dark nav button{color:#A3AFBC}html.dark nav button.on{color:#8DB6E0}
main{padding:12px;max-width:520px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
html.dark .card{box-shadow:none;border:1px solid var(--line)}
h2{font-size:18px;margin:4px 2px 10px}.mut{color:var(--mut);font-size:13px}
.fld{display:block;font-size:13px;color:var(--mut);margin:0 0 10px}
.fld input,.fld textarea,.fld select{display:block;width:100%;margin-top:4px;min-height:48px;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:#1A2430}
html.dark .fld input,html.dark .fld textarea,html.dark .fld select{background:#151C24;color:var(--tx)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border:0;background:var(--g);color:#fff;font-size:16px;font-weight:800;border-radius:24px;padding:12px 18px;font-family:inherit;text-decoration:none;cursor:pointer;white-space:nowrap;transition:filter .15s}
.btn:active{filter:brightness(.92)}.btn:disabled{background:#B9CBDD;cursor:default}html.dark .btn:disabled{background:#2C3B4B;color:#7D8C9B}
.btn.ghost{background:transparent;color:var(--acc);border:2px solid var(--g)}html.dark .btn.ghost{border-color:var(--acc)}
.btn.fly{background:var(--fly)}.btn.fan{background:var(--fan)}.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}.btn.blk{display:flex;width:100%}
.btn.press{animation:bounce .35s cubic-bezier(.3,1.6,.5,1)}@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(.94)}100%{transform:scale(1)}}
.chip{border:1.5px solid var(--g);color:var(--acc);background:var(--card);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.dd{border:1.5px solid #B9CBDD;background:var(--card);color:#1F4468;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}.dd span{font-size:11px;opacity:.7}
html.dark .dd{border-color:#334355;color:#B7CEE6}
.ib{width:36px;height:36px;border:0;border-radius:10px;background:var(--tint);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.ib svg{width:18px;height:18px;fill:none;stroke:var(--tintfg);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row>.btn{flex:1}
.spot{display:flex;gap:10px;align-items:center;border-top:1px dashed var(--bd);padding:10px 0}.spot img{width:32px;height:32px}.spot .tm{font-weight:800;color:var(--acc);min-width:46px}.spot .x{flex:1;min-width:0}.spot .ops{display:flex;gap:4px}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.deal{display:flex;justify-content:space-between;align-items:center;gap:8px}.price{color:var(--fly);font-weight:800;font-size:20px;text-decoration:none}html.dark .price{color:#8FD3A8}
.ui{width:28px;height:28px;vertical-align:middle;margin-right:6px}
footer{text-align:center;font-size:12px;color:#777;line-height:1.9;padding:10px 0 4px}footer a{color:var(--acc);text-decoration:none;font-weight:700;cursor:pointer}footer .copy{color:#aaa;font-size:11px}
html.dark footer{color:#A3AFBC}
.shbg{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}.shbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#FFFDF9;border-radius:20px 20px 0 0;z-index:21;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D3DEE9;margin:4px auto 12px}.sheet h2{margin:0 0 8px}
html.dark .sheet{background:#18212C;color:var(--tx)}html.dark .sheet .grab{background:#334355}
.srcb{display:inline-flex;align-items:center;gap:6px;font-size:13px;border-radius:12px;padding:6px 10px;margin:0 0 10px;background:var(--lg);color:var(--tintfg);font-weight:700}.xsw{display:flex;gap:4px;margin:8px auto 0;max-width:520px;padding:3px;background:var(--xsw-bg,#EFE6D8);border-radius:12px;width:calc(100% - 24px)}
.xsw a{flex:1;text-align:center;min-height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13px;font-weight:700;color:var(--xsw-tx,#6B6157);text-decoration:none}
.xsw a.on{background:var(--xsw-on,#fff);color:var(--g);box-shadow:0 1px 2px rgba(0,0,0,.1)}
html.dark .xsw{--xsw-bg:#232B35;--xsw-tx:#A3AFBC;--xsw-on:#2E3A48}html.dark .xsw a.on{color:var(--acc)}
.spot .lk{font-size:12px;color:var(--acc);font-weight:700;text-decoration:none}.spot .pr{font-size:12px;color:var(--fly);font-weight:800;margin-left:6px}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:20px;z-index:30;font-size:13px}
@media print{header,nav,footer,.noprint{display:none!important}body{padding:0;background:#fff;color:#000}.card{box-shadow:none;border:1px solid #ccc}}
</style></head><body>
<header><button id="annbell" aria-label="公告"><svg viewBox="0 0 24 24"><path d="M3 10v4h3l7 4V6L6 10z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg><b id="annn">1</b></button><img id="logo" src="icons/icon-192.png" alt="旅伴"><h1>旅伴 TripMate<small id="tag">排好行程，機票飯店一起省</small></h1><button id="thbtn" aria-label="切換深色模式"></button><button id="nfybell" aria-label="通知"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><b></b></button></header>
<div class="xsw" role="navigation" aria-label="站台切換"><a id="xsw-fly" href="/flysave/">✈️ 機票</a><a id="xsw-fan" href="/fansave/">🏨 飯店</a><a class="on" href="/trip/" aria-current="page">🧳 行程</a></div>
<main id="app"></main>
<nav id="nav"></nav>
<div class="shbg" id="shbg"></div><div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<script>
const P='trip_',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(P+k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(P+k,JSON.stringify(v))};
const CITY={東京:'NRT',大阪:'KIX',福岡:'FUK',札幌:'CTS',沖繩:'OKA',名古屋:'NGO',首爾:'ICN',釜山:'PUS',曼谷:'BKK',香港:'HKG',新加坡:'SIN',吉隆坡:'KUL',馬尼拉:'MNL',胡志明市:'SGN',河內:'HAN',峇里島:'DPS',巴黎:'CDG',倫敦:'LHR',紐約:'JFK',高雄:'KHH'};
const BASE=location.origin+'/';let trips=ls.get('trips',[]),cur=ls.get('cur',null),tab='list',deals=null;
const save=()=>{ls.set('trips',trips);ls.set('cur',cur);pubCur()},T=()=>trips.find(t=>t.id===cur);
const code=d=>CITY[d]||(/^[A-Za-z]{3}$/.test(d)?d.toUpperCase():d);
const days=t=>{const n=Math.max(1,Math.round((new Date(t.ret)-new Date(t.dep))/864e5)+1);while(t.days.length<n)t.days.push([]);t.days.length=n;return n};
const dayDate=(t,i)=>{const d=new Date(t.dep);d.setDate(d.getDate()+i);return `${d.getMonth()+1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）`};
const flyUrl=t=>`${BASE}flysave/?to=${encodeURIComponent(code(t.dest))}&dep=${t.dep}&ret=${t.ret}&pax=${t.pax}&orig=${t.orig||'TPE'}&from=trip`;
const fanUrl=t=>`${BASE}fansave/?city=${encodeURIComponent(code(t.dest))}&in=${t.dep}&out=${t.ret}&guests=${Math.min(8,t.pax)}&from=trip`;
const TI={list:'<rect x="4" y="7" width="16" height="13" rx="2.5"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M4 12h16M10 12v2h4v-2"/>',new:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/>',edit:'<path d="M4 6l5-2 6 2 5-2v14l-5 2-6-2-5 2z"/><path d="M9 4v14M15 6v14"/>',deals:'<path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/><path d="M10.5 16.5l5-5"/>',more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'};
const IB={up:'<path d="M6 15l6-6 6 6"/>',dn:'<path d="M6 9l6 6 6-6"/>',ed:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',del:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>'};
const ib=(k,on,t)=>`<button class="ib" aria-label="${t}" onclick="${on}"><svg viewBox="0 0 24 24">${IB[k]}</svg></button>`,ui=(n)=>`<img class="ui" src="icons/ui-${n}.svg" alt="">`;
const TABS=[['list','我的行程'],['new','新增行程'],['edit','行程編輯'],['deals','優惠'],['more','其他']];
function go(t){tab=t;history.pushState({tab:t},'');render()}
function pubCur(){const t=T();try{if(!t){localStorage.removeItem('shared_curTrip')}else{const v={id:t.id,dest:code(t.dest),city:t.dest,dep:t.dep,ret:t.ret,pax:t.pax,orig:t.orig||'TPE',updatedAt:Date.now(),from:'trip'},o=JSON.parse(localStorage.getItem('shared_curTrip')||'null');if(!o||o.id!==v.id||o.dep!==v.dep||o.ret!==v.ret||o.dest!==v.dest||o.pax!==v.pax||o.orig!==v.orig)localStorage.setItem('shared_curTrip',JSON.stringify(v))}}catch{}xswLinks()}
function xswLinks(){const t=T(),a=$('#xsw-fly'),b=$('#xsw-fan');if(!a)return;a.href=t?flyUrl(t).replace(BASE,'/'):'/flysave/?from=trip';b.href=t?fanUrl(t).replace(BASE,'/'):'/fansave/?from=trip'}
function consumeInbox(){let box;try{box=JSON.parse(localStorage.getItem('shared_tripInbox')||'[]')}catch{box=[]}if(!Array.isArray(box)||!box.length)return;
const keep=[],msgs=[];for(const it of box){const t=trips.find(x=>x.id===it.tripId)||T();if(!t||!it.data||!/^(flight|hotel)$/.test(it.type)){keep.push(it);continue}days(t);const d=it.data,idx=dt=>{const n=Math.round((new Date(dt)-new Date(t.dep))/864e5);return n>=0&&n<t.days.length?n:-1};
if(it.type==='flight'){let i=idx(d.date||'');if(i<0)i=d.leg==='return'?t.days.length-1:0;t.days[i].push({time:d.time||'',name:`✈️ ${d.flightNo||'航班'} ${d.from||''}→${d.to||''}`.trim(),note:[d.airline,d.arrTime?'抵達 '+d.arrTime:''].filter(Boolean).join(' · '),price:d.price,link:d.link,kind:'flight'});if(d.leg!=='return'&&!d.date)t.days[i].sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));msgs.push('航班')}
else{let a=idx(d.checkin||t.dep),b=idx(d.checkout||t.ret);if(a<0)a=0;if(b<0)b=t.days.length-1;for(let i=a;i<Math.max(a+1,b);i++)t.days[i].push({time:i===a?(d.checkinTime||'15:00'):'',name:`🏨 ${d.name||'住宿'}`,note:i===a?'入住':'續住',price:i===a?d.price:undefined,link:d.link,lat:d.lat,lng:d.lng,kind:'hotel'});if(b>a&&b<t.days.length)t.days[b].unshift({time:d.checkoutTime||'11:00',name:`🏨 ${d.name||'住宿'}`,note:'退房',kind:'hotel'});msgs.push('住宿')}}
localStorage.setItem('shared_tripInbox',JSON.stringify(keep));if(!keep.length)localStorage.removeItem('shared_tripInbox');if(msgs.length){save();if(tab==='edit'||tab==='list')render();toast(`已加入行程：${msgs.join('、')}`)}else if(keep.length&&!T())toast('請先建立行程，再加入航班/住宿')}
function render(){$('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${TI[k]}</svg>${n}</button>`).join('');$('#app').innerHTML=V[tab]()+foot();if(tab==='deals'||tab==='edit')loadDeals()}
const foot=()=>`<footer><a onclick="toast('感謝支持 ☕')">☕ 贊助旅伴</a> · <a onclick="share()">🔗 分享網頁</a><br><a onclick="go('more')">關於我們</a> | <a onclick="go('more')">隱私權政策</a> | <a onclick="go('more')">服務條款</a><br><a href="${BASE}flysave/?from=trip">✈️ 飛省 查機票</a> | <a href="${BASE}fansave/?from=trip">🏨 飯省 找飯店</a><div class="copy">© 2026 旅伴 TripMate · v2.0</div></footer>`;
const V={
list:()=>`<h2>我的行程</h2>`+(trips.length?trips.map(t=>`<div class="card" onclick="cur='${t.id}';save();go('edit')" style="cursor:pointer"><div class="row"><div>${ui('spot')}<b>${esc(t.dest)}</b> <span class="mut">${t.dep} → ${t.ret} · ${t.pax} 人</span></div><span style="flex:0" onclick="event.stopPropagation()">${ib('del',`delTrip('${t.id}')`,'刪除')}</span></div><div class="mut">${t.days.flat().length} 個景點</div></div>`).join(''):`<div class="card mut">還沒有行程，點「新增行程」開始吧！</div>`),
new:()=>{let d=new Date(Date.now()+14*864e5).toISOString().slice(0,10),r=new Date(Date.now()+18*864e5).toISOString().slice(0,10);const ok=x=>x&&/^\d{4}-\d\d-\d\d$/.test(x)&&x>=new Date().toISOString().slice(0,10);if(PF){if(ok(PF.dep))d=PF.dep;if(ok(PF.ret)&&PF.ret>=d)r=PF.ret;else if(ok(PF.dep)){const x=new Date(d);x.setDate(x.getDate()+3);r=x.toISOString().slice(0,10)}}
const bn=PF&&PF.from==='flysave'?'✈️ 從飛省帶入':PF&&PF.from==='fansave'?'🏨 從飯省帶入':PF?'🔗 已帶入行程資料':'';
return `<h2>新增行程</h2>${bn?`<div class="srcb">${bn}</div>`:''}<div class="card"><label class="fld">目的地（城市或機場代碼）<input id="nd" list="cities" placeholder="例：東京" value="${esc(PF?.dest||'')}"></label><datalist id="cities">${Object.keys(CITY).map(c=>`<option>${c}`).join('')}</datalist>
<div class="row"><div><label class="fld">出發<input type="date" id="ndep" value="${d}"></label></div><div><label class="fld">回程<input type="date" id="nret" value="${r}"></label></div></div>
<div class="row"><div><label class="fld">人數<input type="number" id="npax" min="1" max="9" value="${Math.min(9,Math.max(1,+PF?.pax||2))}"></div><div><label class="fld">出發機場<select id="norig"><option>TPE</option><option ${PF?.orig==='KHH'?'selected':''}>KHH</option></select></label></div></div><br><button class="btn blk" onclick="addTrip()">建立行程</button></div>`},
edit:()=>{const t=T();if(!t)return `<h2>行程編輯</h2><div class="card mut">請先建立或選擇一個行程。</div>`;const n=days(t);return `<h2>${esc(t.dest)} ${n} 天 <span class="mut">${t.dep} → ${t.ret} · ${t.pax} 人</span></h2>
<div class="row noprint"><a class="btn fly" href="${flyUrl(t)}" target="_blank">✈️ 飛省查機票</a><a class="btn fan" href="${fanUrl(t)}" target="_blank">🏨 飯省找飯店</a></div>
<div class="row noprint" style="margin-top:8px"><button class="btn ghost" onclick="print()">列印行程</button><button class="btn ghost" onclick="share()">分享行程</button></div>
<div id="tdeals"></div>`+t.days.map((d,i)=>`<div class="card"><div class="dh"><b>Day ${i+1} · ${dayDate(t,i)}</b><button class="btn ghost sm noprint" style="flex:0" onclick="spot(${i})">＋景點</button></div>`+(d.length?d.map((s,j)=>`<div class="spot"><img src="icons/ui-spot.svg" alt=""><span class="tm">${esc(s.time)||'—'}</span><div class="x"><b>${esc(s.name)}</b>${s.price?`<span class="pr">$${(+s.price).toLocaleString()}</span>`:''}${s.link&&/^https?:|^\//.test(s.link)?` <a class="lk" href="${esc(s.link)}" target="_blank" rel="noopener">查看</a>`:''}${s.note?`<div class="mut">${esc(s.note)}</div>`:''}</div><span class="ops noprint">${ib('up',`mv(${i},${j},-1)`,'上移')}${ib('dn',`mv(${i},${j},1)`,'下移')}${ib('ed',`spot(${i},${j})`,'編輯')}${ib('x',`rm(${i},${j})`,'刪除')}</span></div>`).join(''):`<div class="mut">尚未安排</div>`)+`</div>`).join('')},
deals:()=>`<h2>最新機票優惠 <span class="mut">來自飛省</span></h2><div id="dl" class="mut">載入中…</div>`,

function addTrip(){const dest=$('#nd').value.trim(),dep=$('#ndep').value,ret=$('#nret').value;if(!dest||!dep||!ret||ret<dep)return alert('請填寫目的地與正確日期');const t={id:Date.now().toString(36),dest,dep,ret,pax:+$('#npax').value||2,orig:$('#norig').value,days:[]};days(t);trips.unshift(t);cur=t.id;PF=null;save();go('edit')}

function saveSpot(i,j){const s={time:$('#st').value,name:$('#sn').value.trim(),note:$('#so').value.trim()};if(!s.name)return;const d=T().days[i];j<0?d.push(s):d[j]=s;save();closeSheet();render()}
function mv(i,j,k){const d=T().days[i],n=j+k;if(n<0||n>=d.length)return;[d[j],d[n]]=[d[n],d[j]];save();render()}
function rm(i,j){T().days[i].splice(j,1);save();render()}

const t=T();if($('#tdeals')&&t){const c=code(t.dest),m=all.filter(x=>x.code===c||x.dest===t.dest).slice(0,3);$('#tdeals').innerHTML=m.length?`<h2 class="noprint">🔥 ${esc(t.dest)} 機票優惠</h2><div class="noprint">${m.map(card).join('')}</div>`:''}}
function share(){const t=T(),txt=t?`${t.dest} ${t.dep}~${t.ret}\n`+t.days.map((d,i)=>`Day${i+1} `+d.map(s=>`${s.time} ${s.name}`).join('、')).join('\n'):'旅伴 行程規劃';navigator.share?navigator.share({title:'旅伴',text:txt,url:location.href}).catch(()=>{}):navigator.clipboard?.writeText(txt+'\n'+location.href).then(()=>toast('已複製行程'))}
