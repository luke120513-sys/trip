<style>

</style></head><body>

<div class="xsw" role="navigation" aria-label="站台切換"><a id="xsw-fly" href="/flysave/"><img class="xi" src="icons/ui-fly.svg" alt="" width="18" height="18">機票</a><a id="xsw-fan" href="/fansave/"><img class="xi" src="icons/ui-hotel.svg" alt="" width="18" height="18">飯店</a><a class="on" href="/trip/" aria-current="page"><img class="xi" src="icons/ui-suitcase.svg" alt="" width="18" height="18">行程</a></div>

<script>
const P='trip_',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(P+k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(P+k,JSON.stringify(v))};
const CITY={東京:'NRT',大阪:'KIX',京都:'KIX',福岡:'FUK',札幌:'CTS',沖繩:'OKA',名古屋:'NGO',首爾:'ICN',釜山:'PUS',曼谷:'BKK',香港:'HKG',新加坡:'SIN',吉隆坡:'KUL',馬尼拉:'MNL',胡志明市:'SGN',河內:'HAN',峇里島:'DPS',巴黎:'CDG',倫敦:'LHR',紐約:'JFK',高雄:'KHH'};
const BASE=location.origin+'/';let trips=ls.get('trips',[]),cur=ls.get('cur',null),tab='list',deals=null;
const save=()=>{ls.set('trips',trips);ls.set('cur',cur);pubCur()},T=()=>trips.find(t=>t.id===cur);
const code=d=>CITY[d]||(/^[A-Za-z]{3}$/.test(d)?d.toUpperCase():d);

const dayDate=(t,i)=>{const d=new Date(t.dep);d.setDate(d.getDate()+i);return `${d.getMonth()+1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）`};

const TI={list:'<rect x="4" y="7" width="16" height="13" rx="2.5"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M4 12h16M10 12v2h4v-2"/>',new:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/>',edit:'<path d="M4 6l5-2 6 2 5-2v14l-5 2-6-2-5 2z"/><path d="M9 4v14M15 6v14"/>',deals:'<path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/><path d="M10.5 16.5l5-5"/>',more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'};
const IB={up:'<path d="M6 15l6-6 6 6"/>',dn:'<path d="M6 9l6 6 6-6"/>',ed:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',sw:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>',del:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>'};
const ib=(k,on,t)=>`<button class="ib" aria-label="${t}" onclick="${on}"><svg viewBox="0 0 24 24">${IB[k]}</svg></button>`,ui=(n)=>`<img class="ui" src="icons/ui-${n}.svg" alt="">`;
const TABS=[['list','我的行程'],['new','新增行程'],['edit','行程編輯'],['deals','優惠'],['more','其他']];
function go(t){tab=t;history.pushState({tab:t},'');render()}
function pubCur(){const t=T();try{if(!t){localStorage.removeItem('shared_curTrip')}else{const v={id:t.id,dest:code(t.dest),city:t.dest,dep:t.dep,ret:t.ret,pax:t.pax,orig:t.orig||'TPE',updatedAt:Date.now(),from:'trip'},o=JSON.parse(localStorage.getItem('shared_curTrip')||'null');if(!o||o.id!==v.id||o.dep!==v.dep||o.ret!==v.ret||o.dest!==v.dest||o.pax!==v.pax||o.orig!==v.orig)localStorage.setItem('shared_curTrip',JSON.stringify(v))}}catch{}xswLinks()}
function xswLinks(){const t=T(),a=$('#xsw-fly'),b=$('#xsw-fan');if(!a)return;a.href=t?flyUrl(t).replace(BASE,'/'):'/flysave/?from=trip';b.href=t?fanUrl(t).replace(BASE,'/'):'/fansave/?from=trip'}
function consumeInbox(){let box;try{box=JSON.parse(localStorage.getItem('shared_tripInbox')||'[]')}catch{box=[]}if(!Array.isArray(box)||!box.length)return;
const keep=[],msgs=[];for(const it of box){const t=trips.find(x=>x.id===it.tripId)||T();if(!t||!it.data||!/^(flight|hotel)$/.test(it.type)){keep.push(it);continue}days(t);const d=it.data,idx=dt=>{const n=Math.round((new Date(dt)-new Date(t.dep))/864e5);return n>=0&&n<t.days.length?n:-1};
if(it.type==='flight'){let i=idx(d.date||'');if(i<0)i=d.leg==='return'?t.days.length-1:0;t.days[i].push({time:d.time||'',name:`${d.flightNo||'航班'} ${d.from||''}→${d.to||''}`.trim(),note:[d.airline,d.arrTime?'抵達 '+d.arrTime:''].filter(Boolean).join(' · '),price:d.price,link:d.link,kind:'flight'});if(d.leg!=='return'&&!d.date)t.days[i].sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));msgs.push('航班')}
else{let a=idx(d.checkin||t.dep),b=idx(d.checkout||t.ret);if(a<0)a=0;if(b<0)b=t.days.length-1;for(let i=a;i<Math.max(a+1,b);i++)t.days[i].push({time:i===a?(d.checkinTime||'15:00'):'',name:`${d.name||'住宿'}`,note:i===a?'入住':'續住',price:i===a?d.price:undefined,priceLabel:i===a&&+d.price?`${Math.max(1,Math.round((new Date(d.checkout||t.ret)-new Date(d.checkin||t.dep))/864e5))} 晚共 NT$${Math.round(+d.price).toLocaleString()}`:undefined,link:d.link,lat:d.lat,lng:d.lng,kind:'hotel'});if(b>a&&b<t.days.length)t.days[b].unshift({time:d.checkoutTime||'11:00',name:`${d.name||'住宿'}`,note:'退房',kind:'hotel'});msgs.push('住宿')}}
localStorage.setItem('shared_tripInbox',JSON.stringify(keep));if(!keep.length)localStorage.removeItem('shared_tripInbox');if(msgs.length){save();if(tab==='edit'||tab==='list')render();toast(`已加入行程：${msgs.join('、')}`)}else if(keep.length&&!T())toast('請先建立行程，再加入航班/住宿')}
const PK={東京:'tokyo',大阪:'osaka',京都:'kyoto',福岡:'fukuoka',沖繩:'okinawa',首爾:'seoul',釜山:'busan',曼谷:'bangkok',NRT:'tokyo',HND:'tokyo',KIX:'osaka',ITM:'osaka',FUK:'fukuoka',OKA:'okinawa',ICN:'seoul',GMP:'seoul',PUS:'busan',BKK:'bangkok',DMK:'bangkok',香港:'hongkong',HKG:'hongkong',新加坡:'singapore',SIN:'singapore'},PDATE='2026-10-19';
const PKEY=t=>PK[t.dest]||PK[code(t.dest)];
const rIco=r=>/\d\.\d/.test(r)?'⭐':'📝';function spotIcon(s){if(s.kind==='flight')return'fly';if(s.kind==='hotel')return'hotel';return{餐廳:'food',購物:'shop',夜景:'night'}[s.ptype]||'spot'}
let plP=null;function needPlanner(){return plP||(plP=new Promise((ok,no)=>{const e=document.createElement('script');e.src='planner.js';e.onload=()=>ok(window.Planner);e.onerror=no;document.head.append(e)}))}
let PO=ls.get('planOpt',{pace:'標準',interests:['景點','美食','購物','夜景']});
function planSheet(){const t=T();if(!t)return;const own=t.days.flat().filter(x=>!x.kind).length,auto=t.days.flat().filter(x=>x.kind==='auto').length;
$('#sheetBody').innerHTML=`<h2>🪄 一鍵排行程</h2><p class="mut">依多個網路來源的推薦次數排序，同一天集中在相近區域，並自動安排午餐、晚餐。抵達日與回程日會少排一些，已加入的航班／住宿會避開。</p>
