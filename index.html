.roban{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#9C2F2F;color:#fff;border-radius:14px;padding:10px 12px;margin:0 0 12px;font-weight:800}

.archveil[hidden]{display:none}
.archstage{width:min(320px,100%);text-align:center}

.journal>b{display:block;font-size:22px;margin-top:8px}
.journal>small{color:#6E5C4E;font-weight:700}
.jstamp{position:absolute;right:14px;bottom:18px;width:104px;height:104px;border:4px solid rgba(194,59,59,.9);color:#C23B3B;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:rotate(-14deg) scale(1.55);opacity:0;background:rgba(255,251,244,.55);text-align:center;line-height:1.15}
.jstamp b{font-size:14px}.jstamp small{font-size:11px;font-weight:800}
.jstamp.thump{animation:jthump .42s cubic-bezier(.2,1.4,.4,1) forwards}
.jstamp.in{opacity:.92;transform:rotate(-14deg) scale(1)}
@keyframes jthump{0%{opacity:0;transform:rotate(-20deg) scale(1.7)}70%{opacity:.95;transform:rotate(-10deg) scale(.96)}100%{opacity:.92;transform:rotate(-14deg) scale(1)}}

.archsum{margin-top:14px;color:#fff;font-weight:800;opacity:0}

.shelfmini{margin-top:16px;display:inline-block;border:2px solid #fff;color:#fff;border-radius:999px;padding:4px 14px;font-weight:800}

@keyframes shelfslide{to{transform:translateY(110%) scale(.84);opacity:0}}

.setpage{padding:4px 0 12px}

.vmap-layout{display:grid;gap:12px}

.vmap-tools .vmap-fit{width:auto;padding:0 8px;font-size:12px}

.sovstage{padding:8px 0 2px}

function spot(i,j){if(roBlock())return;PICK=null;GEO=null;GEOS=[];URLSPOT=null;spotDay=i;spotIdx=j==null?-1:j;const s=j!=null?T().days[i][j]:{};spotIcoPick=CATSET.has(s.icon)?s.icon:catOf(s);const picks=CATS.map(([k,n])=>`<button type="button" class="ip${k===spotIcoPick?' on':''}" data-ic="${k}" onclick="setIco('${k}')"><img src="icons/cat-${k}.svg" alt="${n}"><span>${n}</span></button>`).join('');$('#sheetBody').innerHTML=`<h2>${j!=null?'編輯':'新增'}景點 · Day ${i+1}</h2><label class="fld">時間<input type="time" id="st" value="${esc(s.time)}"></label><label class="fld">預計停留（分鐘）<input id="sstay" inputmode="numeric" maxlength="3" placeholder="空白則依類型：餐廳約 75、景點約 60、飯店入住約 25" value="${s.stay!=null&&s.stay!==''?esc(s.stay):''}"></label><label class="fld">景點<input id="sn" value="${esc(s.name)}" autocomplete="off" oninput="sugg()" placeholder="店名，或貼上 Google 地圖、食べログ網址"></label><div id="sug"></div><div class="fld">圖示</div><div class="ipick">${picks}</div><label class="fld" id="ilbl"${spotIcoPick==='custom'?'':' hidden'}>自訂分類名稱（選填）<input id="sil" maxlength="12" value="${esc(s.iconLabel||'')}"></label><label class="fld">備註<textarea id="so" rows="2">${esc(s.note)}</textarea></label><div class="row"><button class="btn ghost" onclick="closeSheet()">取消</button><button class="btn" onclick="saveSpot(${i},${j??-1})">儲存</button></div>`;openSheet()}

 if(k&&!force){try{const P=await needPlanner();SD=await P.load(k);const m=P.match(SD,q);html=m.map(it=>`<button type="button" class="sg" onclick="pick('${it.id}')"><img src="icons/ui-${spotIcon({ptype:it.type})}.svg" alt=""><span><b>${esc(it.name)}</b> <small>${esc(it.local||'')}</small><br><small class="mut">${[it.type,it.area,it.rating].filter(Boolean).map(esc).join(' · ')}</small></span></button>`).join('')}catch(e){}}
